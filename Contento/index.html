<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔐 secure save · copy · paste</title>
    <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>

<div class="card">
    <h1><span>🔐</span> secure save</h1>
    <div class="subhead">encrypted password protection · content stays private</div>

    <!-- LOCK SCREEN -->
    <div class="lock-screen" id="lockScreen">
        <div class="lock-icon">🔒</div>
        <input
            type="password"
            id="passwordInput"
            placeholder="enter password"
            autocomplete="off"
            inputmode="numeric"
        >
        <div class="lock-error" id="lockError"></div>
        <button class="btn btn-primary" id="unlockBtn" style="width:100%; justify-content:center; padding:1rem;">
            <i>🔓</i> Unlock
        </button>
    </div>

    <!-- MAIN APP -->
    <div class="app-content" id="appContent">
        <textarea id="contentArea" placeholder="Start typing… your text is saved automatically."></textarea>

        <div class="toolbar">
            <div class="btn-group">
                <button class="btn btn-outline-blue" id="copyBtn" title="Copy content to clipboard"><i>📋</i> Copy</button>
                <button class="btn btn-outline-blue" id="pasteBtn" title="Paste from clipboard"><i>📥</i> Paste</button>
                <button class="btn btn-clear" id="clearBtn" title="Clear textarea & saved content"><i>🗑️</i> Clear</button>
                <button class="btn btn-lock" id="lockBtn" title="Lock the app"><i>🔒</i> Lock</button>
            </div>
            <div class="status" id="statusMessage">⚡ auto‑save active</div>
        </div>

        <div class="footer-note">
            <span>☁️ synced via pastefy</span>
            <span>🔐 end-to-end encrypted</span>
            <span>🔄 syncs on every change</span>
        </div>
    </div>
</div>

<script src="assets/js/main.js"></script>
</body>
</html>
